name: PR check

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build-webhook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/webhook
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/webhook/package-lock.json

      - run: npm ci

      - run: npm run build:cf

  build-dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/TestContainer.Webhook
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - run: dotnet restore

      - run: dotnet build --configuration Release --no-restore

      - run: dotnet pack --configuration Release --no-build -o ./nupkg
