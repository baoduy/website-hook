name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/webhook
    steps:
      - uses: actions/checkout@v5

      - name: Check Cloudflare credentials
        run: |
          missing=""
          if [ -z "${{ secrets.CF_API_TOKEN }}" ]; then missing="$missing CF_API_TOKEN,"; fi
          if [ -z "${{ secrets.CF_ACCOUNT_ID }}" ]; then missing="$missing CF_ACCOUNT_ID,"; fi
          if [ -z "${{ secrets.D1_DATABASE_ID }}" ]; then missing="$missing D1_DATABASE_ID,"; fi
          missing="${missing%,}"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s): $missing. Provision these in the repository's GitHub secret store."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/webhook/package-lock.json

      - run: npm ci

      - run: npm run build:cf

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply website-hook-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WEBSITE_HOOK_D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WEBSITE_HOOK_D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
