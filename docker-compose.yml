services:
  website-hook:
    image: ghcr.io/baoduy/website-hook:latest
    ports:
      - "3000:3000"
    environment:
      DB_PATH: /data/webhook.db
      # Rate limiting is disabled by default. Set to "false" to enable.
    volumes:
      - webhook-data:/data
    restart: unless-stopped

volumes:
  webhook-data:
